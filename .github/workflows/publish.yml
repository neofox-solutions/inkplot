name: Publish

# Stages `inkplot` and `inkplot-scratch` on npm when a GitHub release is published (`npm stage publish`); nothing goes live until
# a maintainer approves each staged version on npmjs.com (or with `npm stage approve <id>`), which asks for 2FA.
#
# Three jobs, so that nothing that installs or runs the repository's dependencies holds a credential:
#  - verify: checks the tag, runs everything, and builds what will be published. Read-only token. Uploads the result.
#  - publish: has the npm (OIDC) credential and does nothing but download what verify built and stage it. No checkout, no install.
#  - assets: has write access to the release and does nothing but download the same files and attach them.
# Authentication is npm Trusted Publishing (OIDC): there is no npm token. Each package must have a trusted publisher
# configured on npmjs.com for this repository, workflow `publish.yml`, and environment `npm`, with `npm stage publish` allowed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to tell whether the tagged commit is on main
      # the version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The one version is the root package.json's: both packages are packed with it (tools/pack-scratch.mjs).
      - name: The release tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: a release is made from main"; exit 1; }
      - run: pnpm exec vp run --concurrency-limit 2 all
      # What publish and assets will use, built here with a read-only token, so what was verified is what goes out.
      - name: Build the packages, the skill zips and the playground
        run: |
          version=$(node -p "require('./package.json').version")
          node tools/pack-scratch.mjs out/release
          # The packer leaves its tarball in each package folder; staging packs the folder again, so the folder alone goes on.
          rm -f out/release/inkplot-lib/inkplot/*.tgz out/release/inkplot-scratch/*.tgz
          node tools/pack-skill-zip.mjs out/skill
          pnpm exec vp run playground
          cp playground.html "out/inkplot-playground-$version.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/release/inkplot-lib/inkplot
            out/release/inkplot-scratch
            out/skill/*.zip
            out/inkplot-playground-*.html
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # `npm stage publish` needs npm 11.15.0 or later: this exact version, never `latest`.
      - run: |
          npm --version
          [ "$(printf '%s\n' 11.15.0 "$(npm --version)" | sort -V | head -n1)" = 11.15.0 ] || npm install -g npm@11.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Stage
        run: |
          # A prerelease (1.0.0-beta.1) goes under its own tag, so `npm install inkplot` stays on the last stable release.
          #   1.0.0-beta.2 -> beta.2 -> beta (letters of the first part) | 1.0.0-2 -> 2 -> next (nothing left) | 1.0.0 -> latest
          version=$(node -p "require('./out/release/inkplot-lib/inkplot/package.json').version")
          case "$version" in *-*) tag=$(echo "${version#*-}" | cut -d. -f1 | tr -d '0-9') ; tag=${tag:-next} ;; *) tag=latest ;; esac
          [ "$tag" != latest ] || [ "$version" = "${version%%-*}" ] || { echo "a prerelease may not be called latest"; exit 1; }
          echo "staging $version with tag $tag"
          # inkplot goes first: inkplot-scratch depends on exactly that version.
          for dir in out/release/inkplot-lib/inkplot out/release/inkplot-scratch; do
            (cd "$dir" && npm stage publish --tag "$tag" --access public)
          done
          echo "Staged. Approve each version on npmjs.com (Staged Packages), or: npm stage list <package>; npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"

  # The files that go on the release page, whether or not the npm versions are approved yet: the two skills as zips to upload
  # (Claude: Customize > Skills > Upload a skill; ChatGPT: Skills > Upload) and the self-contained playground page.
  assets:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to attach the files to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Attach the skill zips and the playground to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" out/skill/*.zip out/inkplot-playground-*.html --clobber
