name: Publish

# Stages `inkplot` and `inkplot-scratch` on npm when a GitHub release is published (`npm stage publish`); nothing goes live until
# a maintainer approves each staged version on npmjs.com (or with `npm stage approve <id>`), which asks for 2FA.
# Authentication is npm Trusted Publishing (OIDC): there is no npm token. Each package must have a trusted publisher
# configured on npmjs.com for this repository, workflow `publish.yml`, and environment `npm`, with `npm stage publish` allowed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: The release tag matches the package versions
        run: |
          version=$(node -p "require('./package.json').version")
          scratch=$(node -p "require('./scratch/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] && [ "$scratch" = "$version" ] || { echo "tag $GITHUB_REF_NAME, inkplot $version, inkplot-scratch $scratch"; exit 1; }
      - run: pnpm run all

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # `npm stage publish` needs npm 11.15.0 or later.
      - run: |
          npm --version
          [ "$(printf '%s\n' 11.15.0 "$(npm --version)" | sort -V | head -n1)" = 11.15.0 ] || npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: node tools/pack-scratch.mjs out/release
      - name: Stage
        run: |
          # A prerelease (1.0.0-beta.1) goes under its own tag, so `npm install inkplot` stays on the last stable release.
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=$(echo "${version#*-}" | cut -d. -f1 | tr -d '0-9') ; tag=${tag:-next} ;; *) tag=latest ;; esac
          echo "staging $version with tag $tag"
          # The packer leaves its tarball in each package folder; staging packs the folder again, so take the tarball out first.
          # inkplot goes first: inkplot-scratch depends on exactly that version.
          for dir in out/release/inkplot-lib/inkplot out/release/inkplot-scratch; do
            rm -f "$dir"/*.tgz
            (cd "$dir" && npm stage publish --tag "$tag" --access public)
          done
          echo "Staged. Approve each version on npmjs.com (Staged Packages), or: npm stage list <package>; npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"

  # The files that go on the release page, whether or not the npm versions are approved yet: the skill for Claude
  # (Customize > Skills > Upload a skill) and the self-contained playground page.
  assets:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to attach the files to the release
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Attach the skill zip and the playground to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          zip=$(node tools/pack-skill-zip.mjs out/skill)
          pnpm run playground
          cp playground.html "out/inkplot-playground-$version.html"
          gh release upload "$GITHUB_REF_NAME" "$zip" "out/inkplot-playground-$version.html" --clobber
