name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # for the coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Type check, lint, unit tests, docs, types, and the browser, PNG and packaging tests.
      # Two tasks at a time: a few tests run against the clock, and CI cores are shared.
      - run: pnpm exec vp run --concurrency-limit 2 all
      # The unit tests' coverage (recorded by the `test` task), as a comment on the pull request and in the job summary.
      - uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        if: always()
        continue-on-error: true # a pull request from a fork has a read-only token and cannot comment
        with:
          file-coverage-mode: none
      # The unit tests, bundled for the `runtimes` job below (the oldest Node, Deno and Bun, which cannot run Vitest).
      - run: node tools/runtime-tests.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-tests
          path: out/runtime-tests
          if-no-files-found: error
          retention-days: 1
      # The tarballs a release would publish, so a packaging problem shows up on the pull request.
      - run: node tools/pack-scratch.mjs out/release
      - run: node tools/pack-skill-zip.mjs out/release/skill
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: |
            out/release/inkplot-lib/inkplot/*.tgz
            out/release/inkplot-scratch/*.tgz
            out/release/skill/*.zip
            playground.html
          if-no-files-found: error
          retention-days: 14

  # The unit tests on the oldest runtime of each kind that the docs name (docs/guide/compatibility.md). Only the tests: no install,
  # build, lint or browser. Each job sets up only its own runtime.
  runtimes:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, version: '16.0.0', run: node }
          - { runtime: deno, version: '1.31.3', run: deno run -A } # the first Deno with `node:` imports, which the tests use
          - { runtime: bun, version: '1.0.0', run: bun }
    name: ${{ matrix.runtime }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src # the tests read their neighbours
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-tests
          path: out/runtime-tests
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.version }}
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.version }}
      - run: |
          failed=0
          for f in out/runtime-tests/*.mjs; do
            ${{ matrix.run }} "$f" > "$RUNNER_TEMP/out.txt" 2>&1 || { echo "::group::FAIL $f"; cat "$RUNNER_TEMP/out.txt"; echo "::endgroup::"; failed=1; }
          done
          exit $failed
