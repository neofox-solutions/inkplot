name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Type check, lint, unit tests, docs, types, and the browser, PNG and packaging tests.
      - run: npm run all
      # The tarballs a release would publish, so a packaging problem shows up on the pull request.
      - run: node tools/pack-scratch.mjs out/release
      - run: node tools/pack-skill-zip.mjs out/release/skill
      - uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: |
            out/release/inkplot-lib/inkplot/*.tgz
            out/release/inkplot-scratch/*.tgz
            out/release/skill/*.zip
            playground.html
          if-no-files-found: error
          retention-days: 14
